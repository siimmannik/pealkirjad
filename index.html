<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Pealkirjajaht – igapäevane uudistemäng teleteksti stiilis.">
<title>Pealkirjajaht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&display=swap">
<style>
/* Layout: one teletext "screen" — page header row, double-height banner, content, fastext buttons, ticker. Single deliberate dark look. */
:root{
  --black:#000;
  --panel:#0a0a14;
  --white:#f3f3ee;
  --dim:#8d8d99;
  --blue:#2a36f0;
  --red:#ff3b30;
  --green:#22e35f;
  --yellow:#ffe41c;
  --cyan:#29e3ff;
  --magenta:#ff47e8;
  --tt:"VT323", "Lucida Console", "Courier New", monospace;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--black);color:var(--white);font-family:var(--tt);font-size:22px;line-height:1.15;-webkit-font-smoothing:none}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--cyan)}
:focus-visible{outline:2px dashed var(--yellow);outline-offset:2px}

.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:12px 64px;position:relative}
.screen{position:relative}
.screen::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 3px);z-index:50}

/* top row */
.toprow{display:flex;gap:12px;align-items:baseline;white-space:nowrap;overflow:hidden;font-size:clamp(17px,4.2vw,24px)}
.toprow .pg{color:var(--white)}
.toprow .nm{color:var(--cyan)}
.toprow .dt{color:var(--white);margin-left:auto}
.toprow .clk{color:var(--yellow);font-variant-numeric:tabular-nums}
@media (max-width:420px){.toprow .dt{display:none}.toprow .clk{margin-left:auto}}

.banner{margin-top:8px;background:var(--blue);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 12px 4px;flex-wrap:wrap}
.banner h1{margin:0;font-weight:400;color:var(--yellow);font-size:clamp(30px,8vw,46px);letter-spacing:.04em;transform:scaleY(1.45);transform-origin:center;line-height:1.3}
.banner .sub{color:var(--white);font-size:clamp(17px,4vw,22px)}
.mosaicbar{height:10px;margin-top:2px;background:
  linear-gradient(90deg,var(--red) 0 16.6%,var(--green) 0 33.3%,var(--yellow) 0 50%,var(--blue) 0 66.6%,var(--magenta) 0 83.3%,var(--cyan) 0);
  -webkit-mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 10px);mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 10px)}

main{margin-top:14px;min-height:300px}

/* generic */
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:baseline}
.y{color:var(--yellow)}.c{color:var(--cyan)}.g{color:var(--green)}.r{color:var(--red)}.m{color:var(--magenta)}.d{color:var(--dim)}
.dh{display:inline-block;transform:scaleY(1.6);transform-origin:left center;margin-block:.3em}
.block{background:var(--panel);padding:12px 14px}
.lede{font-size:clamp(20px,4.6vw,26px);max-width:62ch}
.index{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:4px}
.index li{display:grid;grid-template-columns:4ch 1fr;gap:10px}
.index .n{color:var(--yellow)}
.dots{flex:1;border-bottom:2px dotted var(--dim);transform:translateY(-6px);min-width:20px}

/* fastext buttons */
.fast{display:grid;gap:8px;margin-top:14px}
.fbtn{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;text-align:left;padding:10px 12px;font-size:clamp(20px,4.8vw,26px);line-height:1.1;color:var(--black);min-height:52px}
.fbtn .k{font-size:.8em;border:2px solid currentColor;padding:0 6px;min-width:2.1ch;text-align:center}
.fbtn[data-c="0"]{background:var(--red)}
.fbtn[data-c="1"]{background:var(--green)}
.fbtn[data-c="2"]{background:var(--yellow)}
.fbtn[data-c="3"]{background:var(--cyan)}
.fbtn:hover:not([disabled]){filter:brightness(1.15);transform:translateX(3px)}
.fbtn[disabled]{cursor:default}
.fbtn.dim{opacity:.28}
.fbtn.right{outline:4px solid var(--white);outline-offset:-4px;opacity:1}
.fbtn.wrong{background:var(--black)!important;color:var(--red);box-shadow:inset 0 0 0 3px var(--red);opacity:1}
.fbtn.wrong .k{border-color:var(--red)}

.cta{display:inline-flex;gap:10px;align-items:center;background:var(--green);color:var(--black);padding:8px 16px;font-size:clamp(22px,5vw,28px)}
.cta.alt{background:var(--cyan)}
.cta.ghost{background:transparent;color:var(--cyan);box-shadow:inset 0 0 0 2px var(--cyan)}
.cta:hover{filter:brightness(1.15)}
.cta[disabled]{opacity:.35;cursor:default;filter:none}

/* question header */
.qhead{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;font-size:clamp(18px,4.4vw,24px)}
.qhead .cat{background:var(--white);color:var(--black);padding:0 8px}
.qhead .sc{margin-left:auto;color:var(--yellow);font-variant-numeric:tabular-nums}
.qhead .mul{color:var(--magenta)}
.timer{display:grid;grid-template-columns:repeat(30,1fr);gap:2px;margin-top:8px;height:12px}
.timer i{background:var(--green)}
.timer i.off{background:#1b1b26}
.timer.warn i:not(.off){background:var(--red)}

.qprompt{margin-top:14px;color:var(--cyan);font-size:clamp(20px,4.6vw,25px);max-width:60ch}
.headline{margin-top:10px;font-size:clamp(26px,6.4vw,38px);line-height:1.1;color:var(--white);text-wrap:balance}
.gap{display:inline-block;min-width:5ch;background:var(--magenta);color:var(--black);padding:0 6px;animation:gapblink 1s steps(1) infinite}
@keyframes gapblink{50%{background:var(--white)}}
.quote{margin-top:10px;font-size:clamp(28px,7vw,42px);line-height:1.08;color:var(--yellow);text-wrap:balance}

/* feedback */
.fb{margin-top:16px;border-top:3px solid var(--white);padding-top:10px;display:grid;gap:12px}
.fb p{margin:0}
.verdict{font-size:clamp(28px,7vw,40px);display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.verdict .v{transform:scaleY(1.4);display:inline-block;transform-origin:left}
.explain{font-size:clamp(19px,4.4vw,24px);max-width:64ch;color:var(--white)}
.fbrow{display:flex;gap:14px;align-items:center;flex-wrap:wrap}

/* number */
.numbox{margin-top:16px;display:grid;gap:10px}
.readout{font-size:clamp(48px,14vw,84px);color:var(--yellow);line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.readout small{font-size:24px;color:var(--white)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:12px;background:repeating-linear-gradient(90deg,var(--blue) 0 10px,#000 10px 12px)}
input[type=range]::-moz-range-track{height:12px;background:repeating-linear-gradient(90deg,var(--blue) 0 10px,#000 10px 12px)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:28px;margin-top:-8px;background:var(--yellow);border:0;border-radius:0}
input[type=range]::-moz-range-thumb{width:22px;height:28px;background:var(--yellow);border:0;border-radius:0}
.nudges{display:flex;gap:8px;flex-wrap:wrap}
.nudges button{background:#15151f;color:var(--white);padding:4px 12px;min-width:56px}
.nudges button:hover{background:var(--blue)}
.scale{display:flex;justify-content:space-between;color:var(--dim);font-size:18px}

/* map */
.mapwrap{margin-top:12px;position:relative;background:#000;max-width:100%}
.mapwrap canvas{display:block;width:100%;height:auto;cursor:crosshair;touch-action:manipulation}
.maphint{position:absolute;left:8px;bottom:6px;color:var(--dim);font-size:18px;pointer-events:none}

/* results */
.big{font-size:clamp(56px,16vw,104px);color:var(--yellow);line-height:1;font-variant-numeric:tabular-nums}
.grid{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.grid i{width:26px;height:20px;display:block}
.grid .ok{background:var(--green)}.grid .half{background:var(--yellow)}.grid .bad{background:var(--red)}.grid .to{background:#33334a}

.lb{margin-top:8px;display:grid;gap:2px;font-variant-numeric:tabular-nums}
.lb .li{display:flex;gap:10px;align-items:baseline}
.lb .li .pos{color:var(--yellow);width:3ch;text-align:right}
.lb .li .who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60%}
.lb .li .pts{color:var(--cyan)}
.lb .li.me .who{background:var(--magenta);color:var(--black);padding:0 6px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
.cols>*{min-width:0}
@media (max-width:640px){.cols{grid-template-columns:1fr}}
.h2{color:var(--black);background:var(--cyan);display:inline-block;padding:0 8px;font-size:24px}
.h2.y{background:var(--yellow)}
.h2.g{background:var(--green)}
.arch{display:grid;gap:4px;margin-top:8px}
.arch button{display:flex;gap:10px;align-items:baseline;text-align:left;padding:2px 0}
.arch button:hover .t{color:var(--yellow)}
.arch .t{color:var(--white)}

/* ticker */
.ticker{position:fixed;left:0;right:0;bottom:0;background:var(--blue);color:var(--white);white-space:nowrap;overflow:hidden;padding:4px 0 calc(4px + env(safe-area-inset-bottom,0px));font-size:22px;z-index:40;display:flex}
.ticker .lbl{background:var(--red);color:var(--white);padding:0 10px;position:relative;z-index:2;flex:none}
.ticker .belt{display:inline-block;padding-left:100%;animation:tick var(--dur,80s) linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}

/* loading search */
.seek{font-size:clamp(28px,7vw,44px);margin-top:30px}
.seek .pn{color:var(--yellow);font-variant-numeric:tabular-nums}
.blink{animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}

.soundbtn{color:var(--dim)}
.soundbtn:hover{color:var(--white)}
.note{color:var(--dim);font-size:19px}

@media (prefers-reduced-motion:reduce){
  .ticker .belt{animation:none;padding-left:12px}
  .gap,.blink{animation:none}
  .fbtn:hover:not([disabled]){transform:none}
}
</style>

</head>
<body>
<div class="wrap screen">
  <div class="toprow" aria-hidden="true">
    <span class="pg" id="pgno">P100</span>
    <span class="nm">PEALKIRJAJAHT</span>
    <span class="dt" id="topdate"></span>
    <span class="clk" id="clock">00:00:00</span>
  </div>
  <header class="banner">
    <h1>PEALKIRJAJAHT</h1>
    <span class="sub" id="bannersub">Eesti ja maailma uudised. Iga päev uued.</span>
  </header>
  <div class="mosaicbar" aria-hidden="true"></div>
  <main id="main" aria-live="polite">
    <div class="seek">OTSIN LEHEKÜLGE <span class="pn" id="seekpn">100</span><span class="blink">_</span></div>
    <p class="lede d" style="margin-top:14px">Laen tänast väljaannet…</p>
  </main>
</div>
<div class="ticker" id="ticker" hidden><span class="lbl">UUDISED</span><span class="belt" id="belt"></span></div>

<script src="vendor/d3.min.js"></script>

let soundOn = store.get("pj_sound", true), actx = null;
function beep(freqs, dur=0.09){
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    let t = actx.currentTime;
    for (const f of freqs){
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = "square"; o.frequency.value = f;
      g.gain.setValueAtTime(0.05, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur);
      t += dur;
    }
  } catch {}
}

/* ---------- boot ---------- */
async function boot(){
  let idx;
  try {
    const r = await fetch("editions/index.json", {cache:"no-cache"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    idx = await r.json();
  } catch (e) { return renderError("Väljaannete nimekirja lugemine ebaõnnestus (" + (e && e.message || "viga") + ")."); }
  const dates = (Array.isArray(idx) ? idx : (idx.dates || [])).slice().sort().reverse().slice(0, 21);
  const eds = await Promise.all(dates.map(d => fetch("editions/" + encodeURIComponent(d) + ".json", {cache:"no-cache"}).then(r => r.ok ? r.json() : null).catch(() => null)));
  S.editions = eds.filter(e => e && Array.isArray(e.questions) && e.questions.length);
  loadScores();
  if (!S.editions.length) return renderEmpty();
  S.ed = S.editions[0];
  setTicker(S.ed);
  renderHome();
}

function loadScores(){
  const p = store.get("pj_plays", {});
  S.plays = (p && typeof p === "object") ? p : {};
}

function setTicker(ed){
  const items = (ed.ticker && ed.ticker.length ? ed.ticker : ed.questions.filter(q => q.type !== "fake").map(q => q.headline || q.prompt)).slice(0, 12);
  const belt = $("#belt");
  belt.textContent = items.join("   ▪   ");
  belt.style.setProperty("--dur", Math.max(40, items.join("").length / 5) + "s");
  $("#ticker").hidden = false;
}

}
function shortDate(iso){ const [y,m,d] = iso.split("-"); return d + "." + m; }
function myStreakDays(){
  const set = new Set(Object.keys(S.plays || {}));
  let n = 0; const day = new Date(); day.setHours(12);
  const iso = x => x.getFullYear() + "-" + String(x.getMonth()+1).padStart(2,"0") + "-" + String(x.getDate()).padStart(2,"0");
  if (!set.has(iso(day))) day.setDate(day.getDate() - 1);
  while (set.has(iso(day))) { n++; day.setDate(day.getDate() - 1); }
  return n;
}
function lbHtml(date){
  const p = myPlay(date);

}

      ${counts.map ? `<li><span class="n">105</span><span><span class="m">KAART</span> · näita Eesti kaardil, kus see juhtus</span></li>`:""}
    </ul>
    <div class="row" style="margin-top:18px;gap:16px;align-items:center">
      <button class="cta" id="go">► ${played ? "MÄNGI UUESTI" : "ALUSTA"} <span class="d" style="color:#000;opacity:.6">[OK]</span></button>
      ${played ? `<span class="note">Sinu tulemus: <span class="y">${fmt(played.score)}</span>. Arvesse läheb esimene katse.</span>` : ""}
      ${streak > 1 ? `<span class="note">Päevi järjest: <span class="g">${streak}</span></span>` : ""}
    </div>
    <div class="cols">
      <section><span class="h2 y">SINU TULEMUS ${esc(shortDate(ed.date))}</span>${lbHtml(ed.date)}</section>
      <section><span class="h2">ARHIIV</span>
        <div class="arch">${S.editions.map(e => { const p = myPlay(e.date); return `<button data-date="${esc(e.date)}"><span class="y">${esc(shortDate(e.date))}</span><span class="t">${esc(dayLabel(e))}</span><span class="dots"></span><span class="${p?"c":"d"}">${p ? fmt(p.score) : "—"}</span></button>`; }).join("")}</div>
      </section>
    </div>`;
  $("#go").onclick = startGame;
  $("#snd").onclick = () => { soundOn = !soundOn; store.set("pj_sound", soundOn); $("#snd").textContent = soundOn ? "HELI: SEES" : "HELI: VÄLJAS"; SND.click(); };
  main.querySelectorAll(".arch button").forEach(b => b.onclick = () => { S.ed = S.editions.find(e => e.date === b.dataset.date) || S.ed; setTicker(S.ed); renderHome(); });
  onKeys(e => { if (e.key === "Enter" && document.activeElement === document.body) startGame(); });
}

function startGame(){
  SND.click();
  S.qi = 0; S.score = 0; S.streak = 0; S.res = [];
  renderQuestion();
}

const mult = () => 1 + 0.25 * Math.min(S.streak, 4);

function headHtml(q){
  const cat = CATS[q.cat] || CATS.sise;
  const n = S.ed.questions.length;
  return `<div class="qhead"><span class="cat">${cat.name}</span><span class="c">${TYPE_LABEL[q.type]}</span><span class="d">${S.qi+1}/${n}</span><span class="sc">${fmt(S.score)}</span><span class="mul">×${mult().toFixed(2).replace(".",",")}</span></div>
  <div class="timer" id="timer">${"<i></i>".repeat(30)}</div>`;
}

function startTimer(seconds, onOut){
  stopTimer();
  const t0 = performance.now(), cells = [...document.querySelectorAll("#timer i")], bar = $("#timer");
  S.tStart = t0; S.tLen = seconds * 1000;
  let lastLeft = 30;
  S.timer = setInterval(() => {
    const frac = Math.max(0, 1 - (performance.now() - t0) / S.tLen);
    const left = Math.ceil(frac * 30);
    cells.forEach((c,i) => c.classList.toggle("off", i >= left));
    bar.classList.toggle("warn", frac < 0.25);
    if (left < lastLeft && frac < 0.25) SND.tick();
    lastLeft = left;
    if (frac <= 0) { stopTimer(); onOut(); }
  }, 100);
}
const timeFrac = () => Math.max(0, 1 - (performance.now() - S.tStart) / S.tLen);

function renderQuestion(){
  clearKeys(); S.locked = false;
  const q = S.ed.questions[S.qi];
  setPage((CATS[q.cat] || CATS.sise).page + S.qi);
  let body = "";
  if (q.type === "fake") body = `<p class="qprompt">${esc(q.prompt || "Üks pealkiri on välja mõeldud. Leia võlts.")}</p>`;
  if (q.type === "blank") body = `<p class="qprompt">Mis sõna pealkirjast puudub?</p><p class="headline">${esc(q.headline).replace(/_{2,}/, '<span class="gap">&nbsp;?&nbsp;</span>')}</p>`;
  if (q.type === "who") body = `<p class="qprompt">Kes ütles?</p><p class="quote">„${esc(q.quote)}“</p>`;
  if (["fake","blank","who"].includes(q.type)) {
    body += `<div class="fast" id="opts">${q.options.map((o,i) => `<button class="fbtn" data-c="${i}" data-i="${i}"><span class="k">${KEYS[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>`;
  }
  if (q.type === "number") body = numberHtml(q);
  if (q.type === "map") body = `<p class="qprompt">${esc(q.prompt)}</p><div class="mapwrap"><canvas id="map" aria-label="Eesti kaart, klõpsa asukohale"></canvas><span class="maphint" id="maphint">Klõpsa kaardile</span></div>
    <div class="fbrow" style="margin-top:10px"><button class="cta" id="lock" disabled>KINNITA ASUKOHT</button></div>`;
  main.innerHTML = headHtml(q) + body + `<div id="fb"></div>`;

  if (["fake","blank","who"].includes(q.type)) {
    main.querySelectorAll(".fbtn").forEach(b => b.onclick = () => answerChoice(+b.dataset.i));
    onKeys(e => { const i = KEYS.indexOf(e.key); if (i >= 0 && i < q.options.length) answerChoice(i); });
    startTimer(q.type === "fake" ? 25 : 20, () => answerChoice(-1));
  }
  if (q.type === "number") { wireNumber(q); startTimer(30, () => answerNumber(true)); }
  if (q.type === "map") { wireMap(q); startTimer(35, () => answerMap(true)); }
  window.scrollTo({top:0});
}

function award(base, hit, partial){
  const m = mult();
  const pts = Math.round(base * m);
  S.score += pts;
  S.streak = hit ? S.streak + 1 : 0;
  S.res.push(hit ? "ok" : partial ? "half" : base === 0 && S._timeout ? "to" : "bad");
  S._timeout = false;
  return {pts, m};
}

function verdictHtml(kind, pts, m){
  const T = {ok:["ÕIGE!","g"], bad:["VALE","r"], to:["AEG SAI OTSA","r"], half:["PEAAEGU","y"], great:["TÄPNE!","g"]}[kind];
  return `<div class="verdict"><span class="v ${T[1]}">${T[0]}</span><span class="y">+${fmt(pts)}</span>${m > 1 && pts > 0 ? `<span class="m">×${m.toFixed(2).replace(".",",")}</span>` : ""}</div>`;
}

function showFeedback(html, q){
  const last = S.qi === S.ed.questions.length - 1;
  $("#fb").innerHTML = `<div class="fb">${html}<p class="explain">${esc(q.explain)}</p>
    <div class="fbrow"><button class="cta alt" id="next">${last ? "TULEMUS ►" : "JÄRGMINE ►"}</button>${q.url ? `<a href="${esc(q.url)}" target="_blank" rel="noopener">Loe allikast${q.src ? " (" + esc(q.src) + ")" : ""} ↗</a>` : ""}</div></div>`;
  $("#qscore") && ($("#qscore").textContent = fmt(S.score));
  main.querySelector(".qhead .sc").textContent = fmt(S.score);
  main.querySelector(".qhead .mul").textContent = "×" + mult().toFixed(2).replace(".",",");
  const go = () => { SND.click(); S.qi++; if (S.qi >= S.ed.questions.length) renderResults(); else renderQuestion(); };
  $("#next").onclick = go;
  $("#next").focus({preventScroll:true});
  setTimeout(() => onKeys(e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } }), 250);
  $("#fb").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"nearest"});
}

/* choice questions */
function answerChoice(i){
  if (S.locked) return; S.locked = true; stopTimer(); clearKeys();
  const q = S.ed.questions[S.qi];
  const hit = i === q.answer;
  if (i < 0) S._timeout = true;
  const base = hit ? Math.round(500 + 500 * timeFrac()) : 0;
  const {pts, m} = award(base, hit, false);
  main.querySelectorAll(".fbtn").forEach((b, j) => {
    b.disabled = true;
    if (j === q.answer) b.classList.add("right");
    else if (j === i) b.classList.add("wrong");
    else b.classList.add("dim");
  });
  hit ? SND.ok() : SND.bad();
  let note = "";
  if (q.type === "fake") note = hit ? "" : `<p class="lede">Võlts oli: <span class="y">${esc(q.options[q.answer])}</span></p>`;
  showFeedback(verdictHtml(hit ? "ok" : i < 0 ? "to" : "bad", pts, m) + note, q);
}

/* number questions */
function numberHtml(q){
  return `<p class="qprompt">${esc(q.prompt)}</p>
  <div class="numbox">
    <div class="readout"><span id="nval">0</span><small>${esc(q.unit || "")}</small></div>
    <input type="range" id="nrange" min="0" max="1000" step="1" value="500" aria-label="Sinu pakkumine">
    <div class="scale"><span>${fmt(q.min, q.decimals||0)}</span><span>${fmt(q.max, q.decimals||0)}</span></div>
    <div class="nudges"><button data-d="-10">−−</button><button data-d="-1">−</button><button data-d="1">+</button><button data-d="10">++</button></div>
    <div class="fbrow"><button class="cta" id="lock">KINNITA</button><span class="note">Täpne vastus = 1000 p. Kolm korda mööda = 0.</span></div>
  </div>`;
}
function numFromT(q, t){
  const useLog = q.log !== false && q.min > 0 && q.max / q.min > 20;
  let v = useLog ? Math.exp(Math.log(q.min) + t/1000 * (Math.log(q.max) - Math.log(q.min))) : q.min + t/1000 * (q.max - q.min);
  const d = q.decimals || 0;
  if (d === 0) { const mag = v >= 1000 ? Math.pow(10, Math.floor(Math.log10(v)) - 2) : 1; v = Math.round(v / mag) * mag; }
  else v = Math.round(v * Math.pow(10,d)) / Math.pow(10,d);
  return v;
}
function wireNumber(q){
  const r = $("#nrange"), out = $("#nval");
  const upd = () => { S.guess = numFromT(q, +r.value); out.textContent = fmt(S.guess, q.decimals||0); };
  r.oninput = upd; upd();
  main.querySelectorAll(".nudges button").forEach(b => b.onclick = () => { r.value = Math.max(0, Math.min(1000, +r.value + +b.dataset.d)); upd(); SND.click(); });
  $("#lock").onclick = () => answerNumber(false);
  onKeys(e => { if (e.key === "Enter") answerNumber(false); });
}
function answerNumber(timeout){
  if (S.locked) return; S.locked = true; stopTimer(); clearKeys();
  const q = S.ed.questions[S.qi];
  const g = S.guess, a = q.answer;
  const ratio = Math.max(g, a) / Math.max(1e-9, Math.min(g, a));
  const acc = timeout ? 0 : Math.max(0, 1 - Math.log(ratio) / Math.log(3));
  const base = Math.round(1000 * acc);
  if (timeout) S._timeout = true;
  const hit = base >= 600, partial = base >= 200;
  const {pts, m} = award(base, hit, partial);
  $("#nrange").disabled = true; $("#lock").disabled = true;
  main.querySelectorAll(".nudges button").forEach(b => b.disabled = true);
  hit ? SND.ok() : SND.bad();
  const kind = timeout ? "to" : base >= 900 ? "great" : hit ? "ok" : partial ? "half" : "bad";
  const off = ratio < 1.005 ? "täpselt!" : (ratio.toFixed(2).replace(".",",") + "× " + (g > a ? "liiga palju" : "liiga vähe"));
  showFeedback(verdictHtml(kind, pts, m) + `<p class="lede">Õige vastus: <span class="y">${fmt(a, q.decimals||0)}</span> ${esc(q.unit||"")}. Sinu pakkumine: <span class="c">${fmt(g, q.decimals||0)}</span> <span class="d">(${off})</span></p>`, q);
}

/* map questions */
const proj = (window.d3 && d3.geoConicConformal) ? d3.geoConicConformal().parallels([58,59.33]).rotate([-24.5,0]).center([0,58.6]).scale(MAP.scale).translate(MAP.translate) : null;
const COLS = 125, ROWS = 80, CELL = MAP.W / COLS;
let mosaic = null;
function buildMosaic(){
  if (mosaic) return mosaic;
  const c = document.createElement("canvas"); c.width = COLS; c.height = ROWS;
  const x = c.getContext("2d");
  x.scale(COLS / MAP.W, ROWS / MAP.H);
  x.fillStyle = "#0000ff"; x.fill(new Path2D(MAP.nb));
  x.fillStyle = "#00ff00"; x.fill(new Path2D(MAP.est));
  const px = x.getImageData(0, 0, COLS, ROWS).data;
  mosaic = new Uint8Array(COLS * ROWS);
  for (let i = 0; i < COLS * ROWS; i++) { const g = px[i*4+1], b = px[i*4+2]; mosaic[i] = g > 70 ? 2 : b > 110 ? 1 : 0; }
  return mosaic;
}
function drawMap(q, guess, reveal){
  const cv = $("#map"); if (!cv) return;
  const w = cv.parentElement.clientWidth, dpr = Math.min(2, window.devicePixelRatio || 1);
  const h = w * MAP.H / MAP.W;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  const x = cv.getContext("2d"); x.setTransform(cv.width / MAP.W, 0, 0, cv.height / MAP.H, 0, 0);
  x.fillStyle = "#000"; x.fillRect(0, 0, MAP.W, MAP.H);
  const mz = buildMosaic(), gap = 0.9;
  const col = ["", "#1b2490", "#1fb64f"];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const v = mz[r*COLS + c]; if (!v) continue;
    x.fillStyle = col[v]; x.fillRect(c*CELL, r*CELL, CELL - gap, CELL - gap);
  }
  const cellAt = ([px,py]) => [Math.floor(px / CELL), Math.floor(py / CELL)];
  const blk = (c, r, color, s=1) => { x.fillStyle = color; x.fillRect((c - (s-1)/2)*CELL, (r - (s-1)/2)*CELL, CELL*s - gap, CELL*s - gap); };
  const fs = Math.max(CELL*2.6, 13 * MAP.W / w);
  x.font = `${Math.round(fs)}px VT323, monospace`; x.textBaseline = "middle";
  for (const [nm, lo, la] of CITIES) {
    const p = proj([lo, la]); const [c, r] = cellAt(p);
    blk(c, r, "#f3f3ee");
    const tw = x.measureText(nm).width, right = (c+1.5)*CELL + tw > MAP.W - 4;
    x.fillStyle = "#f3f3ee"; x.textAlign = right ? "right" : "left";
    x.fillText(nm, right ? (c-0.5)*CELL : (c+1.5)*CELL, (r+0.5)*CELL);
  }
  x.textAlign = "left";
  if (reveal && guess) {
    const a = cellAt(proj(guess)), b = cellAt(proj([reveal.lon, reveal.lat]));
    const steps = Math.max(Math.abs(b[0]-a[0]), Math.abs(b[1]-a[1]));
    for (let i = 1; i < steps; i++) { if (i % 2) continue; const c = Math.round(a[0] + (b[0]-a[0]) * i/steps), r = Math.round(a[1] + (b[1]-a[1]) * i/steps); blk(c, r, "#f3f3ee"); }
  }
  if (guess) { const [c, r] = cellAt(proj(guess)); blk(c, r, "#ff47e8", 3); blk(c, r, "#000"); }
  if (reveal) { const [c, r] = cellAt(proj([reveal.lon, reveal.lat])); blk(c, r, "#ffe41c", 3); blk(c, r, "#ff3b30");
    x.fillStyle = "#ffe41c"; x.font = `${Math.round(fs*1.25)}px VT323, monospace`; x.fillText(String(reveal.place || "").toUpperCase(), (c+2.2)*CELL, (r+0.5)*CELL - CELL*2.4); }
}
function wireMap(q){
  S.mapGuess = null;
  const cv = $("#map");
  const redraw = () => drawMap(q, S.mapGuess, S.locked ? q : null);
  redraw();
  (document.fonts && document.fonts.ready || Promise.resolve()).then(redraw);
  S._resize && removeEventListener("resize", S._resize);
  S._resize = redraw; addEventListener("resize", redraw);
  cv.onclick = ev => {
    if (S.locked || !proj) return;
    const rect = cv.getBoundingClientRect();
    const mx = (ev.clientX - rect.left) / rect.width * MAP.W, my = (ev.clientY - rect.top) / rect.height * MAP.H;
    const ll = proj.invert([mx, my]); if (!ll) return;
    S.mapGuess = ll; SND.click(); redraw();
    $("#lock").disabled = false; $("#maphint").textContent = "Klõpsa uuesti, et muuta";
  };
  $("#lock").onclick = () => answerMap(false);
  onKeys(e => { if (e.key === "Enter" && S.mapGuess) answerMap(false); });
}
function answerMap(timeout){
  if (S.locked) return; S.locked = true; stopTimer(); clearKeys();
  const q = S.ed.questions[S.qi];
  const g = S.mapGuess;
  const km = g ? d3.geoDistance(g, [q.lon, q.lat]) * 6371 : null;
  const base = km == null ? 0 : Math.round(1000 * Math.exp(-km / 45));
  if (km == null) S._timeout = true;
  const hit = base >= 600, partial = base >= 250;
  const {pts, m} = award(base, hit, partial);
  drawMap(q, g, q);
  $("#lock").disabled = true; $("#maphint").textContent = "";
  hit ? SND.ok() : SND.bad();
  const kind = km == null ? "to" : km < 8 ? "great" : hit ? "ok" : partial ? "half" : "bad";
  showFeedback(verdictHtml(kind, pts, m) + (km == null ? `<p class="lede">Õige koht: <span class="y">${esc(q.place)}</span></p>` : `<p class="lede">Õige koht: <span class="y">${esc(q.place)}</span>. Sinu märk oli <span class="c">${fmt(km, km < 10 ? 1 : 0)} km</span> kaugusel.</p>`), q);
}

/* ---------- results ---------- */
const RANKS = [[0,"PRAKTIKANT","Pealkirjad libisevad mööda. Homme on uus päev."],[0.25,"REPORTER","Uudisvoog on enam-vähem käes."],[0.45,"UURIV AJAKIRJANIK","Märkad detaile, mis teistel kahe silma vahele jäävad."],[0.65,"TOIMETAJA","Sinu laualt ei lähe ükski võlts pealkiri läbi."],[0.82,"PEATOIMETAJA","Sa loed uudiseid enne, kui need ilmuvad."]];
function maxScore(n){ let s = 0; for (let i = 0; i < n; i++) s += 1000 * (1 + 0.25 * Math.min(i, 4)); return s; }
async function renderResults(){
  clearKeys(); stopTimer(); setPage(199); SND.end();
  const ed = S.ed, n = ed.questions.length;
  const frac = S.score / maxScore(n);
  const rank = RANKS.filter(r => frac >= r[0]).pop();
  const correct = S.res.filter(r => r === "ok").length;
  const first = !myPlay(ed.date);
  main.innerHTML = `
    <div class="row" style="justify-content:space-between"><span class="dh y" style="font-size:clamp(26px,6vw,34px)">LÕPPTULEMUS · ${esc(shortDate(ed.date))}</span></div>
    <div class="big">${fmt(S.score)}</div>
    <div class="grid">${S.res.map(r => `<i class="${r}"></i>`).join("")}</div>
    <p class="lede" style="margin-top:12px"><span class="c">${rank[1]}</span> · ${correct}/${n} täistabamust. ${esc(rank[2])}</p>
    <div class="fbrow" style="margin-top:10px">
      <button class="cta alt" id="share">KOPEERI TULEMUS</button>
      <button class="cta ghost" id="home">◄ AVALEHT</button>
      <span class="note" id="savenote">${first ? "Salvestan…" : "Kordusmäng, arvesse läks esimene katse."}</span>
    </div>
    <section style="margin-top:18px"><span class="h2 y">SINU TULEMUS ${esc(shortDate(ed.date))}</span><div id="lbbox">${lbHtml(ed.date)}</div></section>
    <pre id="sharetxt" hidden></pre>`;
  const emo = {ok:"🟩", half:"🟨", bad:"🟥", to:"⬛"};
  const txt = `PEALKIRJAJAHT ${shortDate(ed.date)} · ${fmt(S.score)} p\n${S.res.map(r => emo[r]).join("")}\n${rank[1]}`;
  $("#share").onclick = async () => {
    try { await navigator.clipboard.writeText(txt); $("#share").textContent = "KOPEERITUD ✓"; }
    catch { const p = $("#sharetxt"); p.hidden = false; p.textContent = txt; const r = document.createRange(); r.selectNodeContents(p); const s = getSelection(); s.removeAllRanges(); s.addRange(r); $("#share").textContent = "VALI JA KOPEERI"; }
  };
  $("#home").onclick = () => { SND.click(); renderHome(); };
  onKeys(e => { if (e.key === "Escape") renderHome(); });
  if (first) {
    S.plays[ed.date] = {score:S.score, correct, total:n, grid:S.res.join(","), at:new Date().toISOString()};
    store.set("pj_plays", S.plays);
    $("#savenote") && ($("#savenote").textContent = "Tulemus on salvestatud selles brauseris.");
    $("#lbbox") && ($("#lbbox").innerHTML = lbHtml(ed.date));
  }
}

boot();
})();
</script>
